<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termin — зависимости модулей</title>
<style>
  :root {
    color-scheme: light dark;
    --background: #11151b;
    --panel: #181e27;
    --panel-raised: #202835;
    --border: #344052;
    --text: #edf2f7;
    --muted: #9aa8b9;
    --dependency: #69b7ff;
    --dependent: #ffad66;
    --selected: #8be28b;
    --edge: #607087;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-columns: minmax(260px, 330px) 1fr;
    overflow: hidden;
    background: var(--background);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  aside {
    display: flex;
    min-height: 0;
    flex-direction: column;
    gap: 18px;
    padding: 22px;
    overflow: auto;
    background: var(--panel);
    border-right: 1px solid var(--border);
  }
  h1 { margin: 0; font-size: 19px; }
  .hint, .counts { color: var(--muted); }
  label { display: grid; gap: 6px; color: var(--muted); }
  input, select, button {
    width: 100%;
    min-height: 38px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--panel-raised);
    color: var(--text);
    font: inherit;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--dependency); }
  fieldset {
    display: grid;
    gap: 9px;
    margin: 0;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  legend { padding: 0 6px; color: var(--muted); }
  .check { display: flex; align-items: center; gap: 8px; color: var(--text); }
  .check input { width: auto; min-height: auto; }
  .lists { display: grid; gap: 14px; }
  .lists h2 { margin: 0 0 5px; font-size: 13px; font-weight: 650; }
  .lists ul { display: grid; gap: 3px; margin: 0; padding: 0; list-style: none; }
  .lists button {
    min-height: 28px;
    padding: 3px 7px;
    overflow: hidden;
    text-align: left;
    text-overflow: ellipsis;
    white-space: nowrap;
    border-color: transparent;
    background: transparent;
  }
  main { position: relative; min-width: 0; min-height: 0; }
  svg { display: block; width: 100%; height: 100%; touch-action: none; }
  .toolbar {
    position: absolute;
    z-index: 2;
    top: 14px;
    right: 14px;
    display: flex;
    gap: 7px;
  }
  .toolbar button { width: auto; min-width: 42px; background: color-mix(in srgb, var(--panel) 92%, transparent); }
  .empty {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 30px;
    color: var(--muted);
    text-align: center;
    pointer-events: none;
  }
  .empty[hidden] { display: none; }
  .edge { fill: none; stroke: var(--edge); stroke-width: 1.6; opacity: .72; }
  .node rect { fill: var(--panel-raised); stroke: var(--border); stroke-width: 1.4; }
  .node text { fill: var(--text); font-size: 13px; pointer-events: none; }
  .node { cursor: pointer; }
  .node:hover rect { stroke: var(--text); }
  .node.dependency rect { stroke: var(--dependency); }
  .node.dependent rect { stroke: var(--dependent); }
  .node.selected rect { fill: color-mix(in srgb, var(--selected) 18%, var(--panel-raised)); stroke: var(--selected); stroke-width: 2.5; }
  .column-label { fill: var(--muted); font-size: 12px; text-anchor: middle; }
  @media (prefers-color-scheme: light) {
    :root {
      --background: #f6f8fb; --panel: #ffffff; --panel-raised: #f7f9fc;
      --border: #cbd5e1; --text: #172033; --muted: #64748b;
      --dependency: #1877c9; --dependent: #c46213; --selected: #26813a; --edge: #8b9aaf;
    }
  }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { max-height: 44vh; border-right: 0; border-bottom: 1px solid var(--border); padding: 14px; }
    .lists { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<aside>
  <div>
    <h1>Зависимости модулей</h1>
    <div class="hint">Стрелка направлена от модуля к его зависимости. Клик по узлу меняет фокус.</div>
  </div>
  <label>Модуль
    <input id="module-input" list="module-list" autocomplete="off" placeholder="Начните вводить имя…">
    <datalist id="module-list"></datalist>
  </label>
  <label>Глубина
    <select id="depth">
      <option value="1">Только прямые</option>
      <option value="2">Два уровня</option>
      <option value="all">Все транзитивные</option>
    </select>
  </label>
  <fieldset>
    <legend>Показывать</legend>
    <label class="check"><input id="dependencies" type="checkbox" checked> зависимости</label>
    <label class="check"><input id="dependents" type="checkbox" checked> зависимые модули</label>
  </fieldset>
  <div id="counts" class="counts"></div>
  <div class="lists">
    <section><h2>Прямые зависимости</h2><ul id="dependency-list"></ul></section>
    <section><h2>Прямые потребители</h2><ul id="dependent-list"></ul></section>
  </div>
</aside>
<main>
  <div class="toolbar">
    <button id="fit" title="Вписать граф">Вписать</button>
  </div>
  <svg id="graph" role="img" aria-label="Интерактивный граф зависимостей">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"></path>
      </marker>
    </defs>
    <g id="viewport"></g>
  </svg>
  <div id="empty" class="empty">Выберите модуль слева</div>
</main>
<script id="graph-data" type="application/json">__DEPENDENCY_GRAPH_DATA__</script>
<script>
(() => {
  "use strict";
  const data = JSON.parse(document.getElementById("graph-data").textContent);
  const nodeIds = data.nodes.map(node => node.id);
  const nodeSet = new Set(nodeIds);
  const dependencies = new Map(nodeIds.map(id => [id, []]));
  const dependents = new Map(nodeIds.map(id => [id, []]));
  for (const edge of data.edges) {
    dependencies.get(edge.source).push(edge.target);
    dependents.get(edge.target).push(edge.source);
  }
  for (const values of [...dependencies.values(), ...dependents.values()]) values.sort();

  const input = document.getElementById("module-input");
  const depthInput = document.getElementById("depth");
  const dependenciesInput = document.getElementById("dependencies");
  const dependentsInput = document.getElementById("dependents");
  const viewport = document.getElementById("viewport");
  const svg = document.getElementById("graph");
  const empty = document.getElementById("empty");
  const counts = document.getElementById("counts");
  const ns = "http://www.w3.org/2000/svg";
  let selected = "";
  let viewBox = {x: 0, y: 0, width: 1000, height: 700};

  const list = document.getElementById("module-list");
  for (const id of nodeIds) {
    const option = document.createElement("option");
    option.value = id;
    list.append(option);
  }

  function walk(start, adjacency, maxDepth) {
    const distances = new Map();
    const queue = [[start, 0]];
    while (queue.length) {
      const [current, distance] = queue.shift();
      if (distance >= maxDepth) continue;
      for (const next of adjacency.get(current) || []) {
        if (next === start || distances.has(next)) continue;
        distances.set(next, distance + 1);
        queue.push([next, distance + 1]);
      }
    }
    return distances;
  }

  function svgElement(name, attributes = {}) {
    const element = document.createElementNS(ns, name);
    for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
    return element;
  }

  function setViewBox(box) {
    viewBox = box;
    svg.setAttribute("viewBox", `${box.x} ${box.y} ${box.width} ${box.height}`);
  }

  function renderList(id, items) {
    const root = document.getElementById(id);
    root.replaceChildren();
    if (!items.length) {
      const item = document.createElement("li");
      item.className = "hint";
      item.textContent = "нет";
      root.append(item);
      return;
    }
    for (const module of items) {
      const item = document.createElement("li");
      const button = document.createElement("button");
      button.textContent = module;
      button.addEventListener("click", () => select(module));
      item.append(button);
      root.append(item);
    }
  }

  function select(module, updateHash = true) {
    if (!nodeSet.has(module)) return;
    selected = module;
    input.value = module;
    if (updateHash) history.replaceState(null, "", `#${encodeURIComponent(module)}`);
    render();
  }

  function render() {
    viewport.replaceChildren();
    if (!selected) return;
    empty.hidden = true;
    const maxDepth = depthInput.value === "all" ? Infinity : Number(depthInput.value);
    const dependencyDistances = dependenciesInput.checked ? walk(selected, dependencies, maxDepth) : new Map();
    const dependentDistances = dependentsInput.checked ? walk(selected, dependents, maxDepth) : new Map();
    const visible = new Set([selected, ...dependencyDistances.keys(), ...dependentDistances.keys()]);
    const columns = new Map([[0, [selected]]]);
    const rowsPerColumn = 10;
    function placeSide(distances, direction) {
      const byDistance = new Map();
      for (const [id, distance] of distances) {
        if (!byDistance.has(distance)) byDistance.set(distance, []);
        byDistance.get(distance).push(id);
      }
      let column = direction;
      for (const distance of [...byDistance.keys()].sort((a, b) => a - b)) {
        const modules = byDistance.get(distance).sort();
        for (let offset = 0; offset < modules.length; offset += rowsPerColumn) {
          columns.set(column, modules.slice(offset, offset + rowsPerColumn));
          column += direction;
        }
      }
    }
    placeSide(dependentDistances, -1);
    const dependencyOnly = new Map(
      [...dependencyDistances].filter(([id]) => !dependentDistances.has(id))
    );
    placeSide(dependencyOnly, 1);

    const columnKeys = [...columns.keys()].sort((a, b) => a - b);
    const maxRows = Math.max(...[...columns.values()].map(items => items.length));
    const xGap = 300;
    const yGap = 66;
    const nodeWidth = 210;
    const nodeHeight = 38;
    const positions = new Map();
    for (const column of columnKeys) {
      const modules = columns.get(column);
      const offset = (maxRows - modules.length) * yGap / 2;
      modules.forEach((id, index) => positions.set(id, {
        x: (column - columnKeys[0]) * xGap + 70,
        y: offset + index * yGap + 75,
      }));
    }

    const labels = [[0, "Выбранный модуль"]];
    if (columnKeys[0] < 0) labels.push([columnKeys[0], "Зависимые модули"]);
    if (columnKeys.at(-1) > 0) labels.push([columnKeys.at(-1), "Зависимости"]);
    for (const [column, label] of labels) {
      const x = (column - columnKeys[0]) * xGap + 70 + nodeWidth / 2;
      const text = svgElement("text", {x, y: 35, class: "column-label"});
      text.textContent = label;
      viewport.append(text);
    }

    function traversalEdge(edge) {
      const dependencySource = edge.source === selected ? 0 : dependencyDistances.get(edge.source);
      const dependencyTarget = edge.target === selected ? 0 : dependencyDistances.get(edge.target);
      if (dependencySource !== undefined && dependencyTarget === dependencySource + 1) return true;
      const dependentSource = edge.source === selected ? 0 : dependentDistances.get(edge.source);
      const dependentTarget = edge.target === selected ? 0 : dependentDistances.get(edge.target);
      return dependentTarget !== undefined && dependentSource === dependentTarget + 1;
    }

    for (const edge of data.edges) {
      if (!visible.has(edge.source) || !visible.has(edge.target) || !traversalEdge(edge)) continue;
      const source = positions.get(edge.source);
      const target = positions.get(edge.target);
      if (!source || !target) continue;
      const startsRight = target.x >= source.x;
      const x1 = source.x + (startsRight ? nodeWidth : 0);
      const x2 = target.x + (startsRight ? 0 : nodeWidth);
      const y1 = source.y + nodeHeight / 2;
      const y2 = target.y + nodeHeight / 2;
      const curve = Math.max(45, Math.abs(x2 - x1) * .42);
      const path = svgElement("path", {
        class: "edge",
        d: `M ${x1} ${y1} C ${x1 + (startsRight ? curve : -curve)} ${y1}, ${x2 + (startsRight ? -curve : curve)} ${y2}, ${x2} ${y2}`,
        "marker-end": "url(#arrow)",
      });
      const title = svgElement("title");
      title.textContent = `${edge.source} зависит от ${edge.target}`;
      path.append(title);
      viewport.append(path);
    }

    for (const [id, position] of positions) {
      let kind = "";
      if (id === selected) kind = "selected";
      else if (dependencyDistances.has(id)) kind = "dependency";
      else if (dependentDistances.has(id)) kind = "dependent";
      const group = svgElement("g", {class: `node ${kind}`, tabindex: "0", role: "button"});
      group.setAttribute("transform", `translate(${position.x} ${position.y})`);
      group.append(svgElement("rect", {width: nodeWidth, height: nodeHeight, rx: 8}));
      const text = svgElement("text", {x: 12, y: 24});
      text.textContent = id;
      group.append(text);
      group.addEventListener("click", () => select(id));
      group.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") select(id);
      });
      viewport.append(group);
    }

    const width = Math.max(500, columnKeys.length * xGap - (xGap - nodeWidth) + 140);
    const height = Math.max(320, maxRows * yGap + 130);
    setViewBox({x: 0, y: 0, width, height});
    counts.textContent = `${visible.size} модулей, ${[...viewport.querySelectorAll(".edge")].length} связей`;
    renderList("dependency-list", dependencies.get(selected));
    renderList("dependent-list", dependents.get(selected));
  }

  input.addEventListener("change", () => select(input.value.trim()));
  input.addEventListener("keydown", event => {
    if (event.key === "Enter") select(input.value.trim());
  });
  for (const control of [depthInput, dependenciesInput, dependentsInput]) control.addEventListener("change", render);
  document.getElementById("fit").addEventListener("click", render);

  let drag = null;
  svg.addEventListener("pointerdown", event => {
    drag = {x: event.clientX, y: event.clientY, box: {...viewBox}};
    svg.setPointerCapture(event.pointerId);
  });
  svg.addEventListener("pointermove", event => {
    if (!drag) return;
    const scaleX = drag.box.width / svg.clientWidth;
    const scaleY = drag.box.height / svg.clientHeight;
    setViewBox({...drag.box, x: drag.box.x - (event.clientX - drag.x) * scaleX, y: drag.box.y - (event.clientY - drag.y) * scaleY});
  });
  svg.addEventListener("pointerup", () => { drag = null; });
  svg.addEventListener("wheel", event => {
    event.preventDefault();
    const factor = event.deltaY > 0 ? 1.12 : .88;
    const rect = svg.getBoundingClientRect();
    const px = (event.clientX - rect.left) / rect.width;
    const py = (event.clientY - rect.top) / rect.height;
    const width = viewBox.width * factor;
    const height = viewBox.height * factor;
    setViewBox({x: viewBox.x + (viewBox.width - width) * px, y: viewBox.y + (viewBox.height - height) * py, width, height});
  }, {passive: false});

  const hashModule = decodeURIComponent(location.hash.slice(1));
  select(nodeSet.has(hashModule) ? hashModule : (nodeSet.has("termin-app") ? "termin-app" : nodeIds[0]), false);
})();
</script>
</body>
</html>
