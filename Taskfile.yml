version: '3'

includes:
  maintenance:
    taskfile: ./taskfiles/maintenance.yml
    flatten: true

  build:
    taskfile: ./taskfiles/build.yml
    flatten: true

  distribution:
    taskfile: ./taskfiles/distribution.yml
    flatten: true

  quality:
    taskfile: ./taskfiles/quality.yml
    flatten: true

  docs:
    taskfile: ./taskfiles/docs.yml
    flatten: true

  environment:
    taskfile: ./taskfiles/environment.yml
    flatten: true

  runtime:
    taskfile: ./taskfiles/runtime.yml
    flatten: true

  ci:
    taskfile: ./taskfiles/ci.yml
    flatten: true

silent: true

tasks:
  default:
    aliases: [help]
    desc: Show the grouped Termin monorepo command menu
    cmds:
      - '{{if eq OS "windows"}}python ./scripts/task_menu.py {{.CLI_ARGS}}{{else}}python3 ./scripts/task_menu.py {{.CLI_ARGS}}{{end}}'
