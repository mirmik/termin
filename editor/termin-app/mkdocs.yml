site_name: Termin Editor
site_description: 3D-движок — ECS, физика, рендеринг, анимация, навигация
site_url: https://mirmik.github.io/termin/termin-app/
repo_url: https://github.com/mirmik/termin
repo_name: mirmik/termin
edit_uri: edit/master/editor/termin-app/docs/
docs_dir: docs
theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
nav:
  - Главная: index.md
  - Быстрый старт: getting-started.md
  - Концепции: concepts.md
  - Termin CLI: termin-cli.md
  - Project build manifest: project-build-manifest.md
  - API:
    - Обзор: api/index.md
    - C API: api/c-api.md
  - Архитектура:
    - Расширения сцены: scene_extensions_architecture.md
    - Архитектура редактора: editor-architecture.md
    - Flat Viewport/RenderTarget: rendering-flat-viewport-target-model.md
    - Editor MCP diagnostics: editor-mcp.md
