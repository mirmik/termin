<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Падающий шар · Termin</title>
<style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; color: #f0f2f5; background: #13171c; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1340px; margin: 0 auto; padding: clamp(16px, 3vw, 40px); }
    header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    h1 { margin: 0; font-weight: 600; font-size: clamp(28px, 5vw, 44px); line-height: 1.1; letter-spacing: -.045em; }
    button { min-height: 44px; padding: 9px 19px; color: #221709; background: #f6bd65; border: 0; border-radius: 8px;
             font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible, canvas:focus-visible { outline: 2px solid white; outline-offset: 2px; }
    .panels { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; }
    h2 { font-size: 16px; font-weight: 600; margin: 0; }
    .panel-heading { min-height: 32px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    #reading { font: 13px ui-monospace, monospace; color: #a6dfd1; white-space: nowrap; }
    .stage { position: relative; background: #07090b; border: 1px solid #343c45; border-radius: 12px; overflow: hidden; }
    canvas { width: 100%; height: clamp(290px, min(48vh, 33vw), 440px); display: block; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #status { position: absolute; inset: 0; display: grid; place-content: center; margin: 0; padding: 1em;
              background: #13171ceb; text-align: center; overflow-wrap: anywhere; }
    #status[hidden] { display: none; }
    .hint { margin: 10px 0 0; color: #b2bdc7; font-size: 14px; line-height: 1.5; }
    @media (max-width: 760px) {
        .panels { grid-template-columns: minmax(0, 1fr); }
        canvas { height: clamp(245px, 60vw, 340px); }
        #height-chart { height: clamp(220px, 55vw, 300px); }
    }
</style>
</head>
<body>
<main>
    <header>
        <h1>Падающий шар</h1>
        <button type="button" id="reset" autocomplete="off" disabled>Вернуть шар</button>
    </header>
    <div class="panels">
        <section>
            <div class="panel-heading"><h2>Сцена</h2></div>
            <div class="stage">
                <canvas id="termin-canvas" width="800" height="480" tabindex="0" aria-label="Шар над платформой"
                        aria-describedby="camera-hint"></canvas>
                <p id="status" role="status">Загрузка сцены…</p>
            </div>
            <p class="hint" id="camera-hint">Нажмите «Отпустить шар» внутри сцены. Чтобы повернуть камеру, перетащите фон.</p>
        </section>
        <section>
            <div class="panel-heading"><h2 id="chart-heading">Высота центра шара</h2><span id="reading"></span></div>
            <div class="stage"><canvas id="height-chart" aria-labelledby="chart-heading" aria-describedby="chart-hint"></canvas></div>
            <p class="hint" id="chart-hint">Первые 5 секунд падения. Высота отсчитывается от нуля сцены, платформа расположена ниже.</p>
        </section>
    </div>
</main>
<script type="module">
import {createTerminCore, webAssetUrl} from "./termin-web-core.mjs?v=20261124-srgb1";
import {createTerminWebHost} from "./termin-web-host.mjs?v=20261124-srgb1";
import {createTerminWebInputAdapter} from "./termin-web-input.mjs?v=20261124-srgb1";
import {createTerminChart2D} from "./termin-web-chart2d.mjs?v=20261124-srgb1";

const canvas = document.getElementById("termin-canvas");
const status = document.getElementById("status");
const reset = document.getElementById("reset");
const reading = document.getElementById("reading");
const range = {xMin: 0, xMax: 5, yMin: -1, yMax: 1.25};
const sampleLimit = 301; // Initial position, then five seconds at the scene's fixed 60 Hz.
const number = new Intl.NumberFormat("ru-RU", {minimumFractionDigits: 2, maximumFractionDigits: 2});

function showError(error) {
    status.hidden = false;
    status.textContent = error instanceof Error ? error.message : String(error);
    reset.disabled = true;
    console.error("Physics scene failed", error);
}

try {
    const core = await createTerminCore();
    const input = createTerminWebInputAdapter(core, {canvas}).attach();
    let chart;
    let plottedSamples = 0;
    function updateChart() {
        if (plottedSamples === sampleLimit) return;
        const {times, heights} = host.readRigidBodyHeightTrace();
        if (times.length === plottedSamples) return;
        chart.setData(times, heights);
        const last = times.length - 1;
        reading.textContent = `${number.format(times[last])} с · ${number.format(heights[last])} м`;
        plottedSamples = times.length;
    }
    function beginMeasurement() {
        host.recordRigidBodyHeight("drop-ball", sampleLimit);
        plottedSamples = 0;
        updateChart();
    }
    const host = createTerminWebHost(core, {
        canvas,
        graphicsBackend: new URL(location.href).searchParams.get("backend") ?? "auto",
        onFrame: updateChart,
        onStateChange({state, error}) { if (state === "error") showError(error); },
    });
    globalThis.__terminViewer = {core, host, input};
    const scene = webAssetUrl("scene.trpkg", "./fixtures/physics-scene/package.trpkg");
    // Redraw the suspended ball and its native controls without advancing physics.
    function drawPreview() {
        if (!core.module._termin_web_host_tick(0)) {
            throw new Error(core.module.UTF8ToString(core.module._termin_web_host_error()));
        }
    }
    let pendingPreview = 0;
    function schedulePreview() {
        if ((host.state !== "ready" && host.state !== "stopped") || pendingPreview) return;
        pendingPreview = requestAnimationFrame(() => {
            pendingPreview = 0;
            if (host.state !== "ready" && host.state !== "stopped") return;
            try { drawPreview(); } catch (error) { showError(error); }
        });
    }
    new ResizeObserver(schedulePreview).observe(canvas);
    for (const name of ["pointerdown", "pointermove", "pointerup", "pointercancel", "wheel", "keydown", "keyup", "blur"]) {
        canvas.addEventListener(name, schedulePreview, {passive: true});
    }

    await host.load(scene, {autoStart: false});
    chart = await createTerminChart2D(document.getElementById("height-chart"), {
        packageUrl: scene, backend: host.graphicsBackend, range,
        xLabel: "Время, с", yLabel: "Z, м", seriesName: "",
    });
    drawPreview();
    beginMeasurement();
    host.onUiButtonClick("physics-hud", "release", () => {
        if (host.state !== "ready" && host.state !== "stopped") return;
        try {
            host.setUiWidgetEnabled("physics-hud", "release", false);
            host.start();
            reset.disabled = false;
        } catch (error) { showError(error); }
    });
    reset.addEventListener("click", () => {
        reset.disabled = true;
        try {
            host.stop();
            host.resetRigidBody("drop-ball");
            host.setUiWidgetEnabled("physics-hud", "release", true);
            drawPreview();
            chart.setRange(range);
            beginMeasurement();
        } catch (error) { showError(error); }
    });
    input.setEnabled(true);
    status.hidden = true;
} catch (error) { showError(error); }
</script>
</body>
</html>
