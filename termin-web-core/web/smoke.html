<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Termin Web core smoke</title></head>
<body style="margin: 0; background: #080d18; color: #dce7ff; font-family: monospace">
<canvas id="termin-canvas" width="640" height="360"></canvas>
<pre id="host-status">idle</pre>
<pre id="result">TERMIN_WEB_CORE_SMOKE_RUNNING</pre>
<script type="module">
import { createTerminCore } from "./termin-web-core.mjs?v=20260802-input4";
import { createTerminWebHost, TerminWebHostState } from "./termin-web-host.mjs?v=20260802-input4";
import { createTerminWebInputAdapter } from "./termin-web-input.mjs?v=20260802-input4";

const result = document.querySelector("#result");
globalThis.__terminSmokeAsyncError = "";
globalThis.addEventListener("error", (event) => {
    globalThis.__terminSmokeAsyncError = event.error?.stack ?? event.message;
});
globalThis.addEventListener("unhandledrejection", (event) => {
    globalThis.__terminSmokeAsyncError = event.reason?.stack ?? String(event.reason);
});
try {
    const core = await createTerminCore();
    globalThis.__terminSmokeModule = core.module;
    core.smoke();
    const host = createTerminWebHost(core, {
        statusElement: document.querySelector("#host-status"),
    });
    const input = createTerminWebInputAdapter(core, {
        canvas: document.querySelector("#termin-canvas"),
    }).attach();
    await host.load("./fixtures/render-package/");
    input.setEnabled(true);
    globalThis.__terminSmokeInput = input;
    await host.waitForFrames(3);
    if (host.state !== TerminWebHostState.Running || host.entityCount() !== 2) {
        throw new Error("runtime host did not enter running state with two packaged entities");
    }
    await new Promise((resolve) => setTimeout(resolve, 200));
    const canvas = document.querySelector("#termin-canvas");
    globalThis.__terminSmokeFrame = {
        metrics: {...host.metrics},
    };
    result.textContent = "TERMIN_WEB_CORE_FRAME_READY";
    await new Promise((resolve) => {
        globalThis.__terminSmokeContinue = resolve;
    });
    await host.reload("./fixtures/render-package/");
    await host.waitForFrames(2);
    if (host.entityCount() !== 2) {
        throw new Error("runtime host reload lost the entry scene");
    }
    await host.teardown();
    input.setEnabled(false);
    if (host.state !== TerminWebHostState.Idle || host.entityCount() !== 0) {
        throw new Error("runtime host teardown did not release the package");
    }
    try {
        await host.load("./fixtures/invalid-package/");
        throw new Error("invalid package unexpectedly loaded");
    } catch (error) {
        if (!error.message.includes("version 2") ||
                host.state !== TerminWebHostState.Error) {
            throw error;
        }
    }
    try {
        await host.load("./fixtures/missing-package/");
        throw new Error("missing package unexpectedly loaded");
    } catch (error) {
        if (!error.message.includes("HTTP 404") ||
                host.state !== TerminWebHostState.Error) {
            throw error;
        }
    }
    try {
        await host.load("./fixtures/invalid-path-package/");
        throw new Error("escaping package path unexpectedly loaded");
    } catch (error) {
        if (!error.message.includes("dot segments") ||
                host.state !== TerminWebHostState.Error) {
            throw error;
        }
    }
    await host.teardown();
    input.detach();
    await core.renderSmoke();
    canvas.width = 800;
    canvas.height = 450;
    core.resize(800, 450);
    result.textContent = "TERMIN_WEB_CORE_SMOKE_PASSED";
} catch (error) {
    const details = error instanceof Error
        ? (error.stack ?? error.message)
        : JSON.stringify({
            thrown: error,
            hostStatus: document.querySelector("#host-status")?.textContent,
            hostError: globalThis.__terminSmokeModule
                ? globalThis.__terminSmokeModule.UTF8ToString(
                    globalThis.__terminSmokeModule._termin_web_host_error())
                : "",
            graphicsError: globalThis.__terminSmokeModule
                ? globalThis.__terminSmokeModule.UTF8ToString(
                    globalThis.__terminSmokeModule._termin_web_host_graphics_error())
                : "",
        });
    result.textContent = `TERMIN_WEB_CORE_SMOKE_FAILED: ${details}`;
}
</script>
</body>
</html>
