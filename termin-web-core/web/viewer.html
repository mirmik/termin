<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Termin Web Viewer</title>
<style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050914; }
    #termin-canvas { width: 100vw; height: 100vh; display: block; outline: none; touch-action: none; }
    .panel {
        position: fixed; z-index: 2; color: #eaf1ff;
        background: color-mix(in srgb, #07101f 78%, transparent);
        border: 1px solid rgba(151, 184, 255, .22); border-radius: 14px;
        box-shadow: 0 16px 50px rgba(0, 0, 0, .35); backdrop-filter: blur(14px);
    }
    #brand { top: 18px; left: 18px; padding: 13px 16px; }
    #brand strong { display: block; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
    #brand span { display: block; margin-top: 5px; color: #9eb1d5; font: 12px/1.35 ui-monospace, monospace; }
    #help { right: 18px; bottom: 18px; max-width: 330px; padding: 13px 16px; color: #b8c8e7; font-size: 12px; line-height: 1.55; }
    #help b { color: #f1f5ff; font-weight: 600; }
    #error { display: none; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(620px, calc(100vw - 32px)); padding: 18px; color: #ffd7dd; border-color: rgba(255, 101, 126, .45); }
    #error[data-visible="true"] { display: block; }
    #loading { left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 13px 17px; font: 13px ui-monospace, monospace; }
    #loading[data-hidden="true"] { display: none; }
    @media (max-width: 700px) { #help { left: 18px; max-width: none; } }
</style>
</head>
<body>
<canvas id="termin-canvas" width="1280" height="720" tabindex="0" aria-label="Termin 3D scene"></canvas>
<div id="brand" class="panel">
    <strong>Termin Web Viewer</strong>
    <span id="status">инициализация…</span>
</div>
<div id="help" class="panel">
    <b>Левая кнопка + движение</b> — вращение<br>
    <b>Правая кнопка + движение</b> — панорама<br>
    <b>Колесо</b> — масштаб · <b>касание</b> — orbit/pinch
</div>
<div id="loading" class="panel">Загрузка package и WebGPU…</div>
<div id="error" class="panel" role="alert"></div>
<script type="module">
import {createTerminCore} from "./termin-web-core.mjs?v=20260807-lifecycle1";
import {createTerminWebHost} from "./termin-web-host.mjs?v=20260807-lifecycle1";
import {createTerminWebInputAdapter} from "./termin-web-input.mjs?v=20260807-lifecycle1";

const canvas = document.querySelector("#termin-canvas");
const status = document.querySelector("#status");
const loading = document.querySelector("#loading");
const errorPanel = document.querySelector("#error");

function fail(error) {
    const message = error instanceof Error ? (error.stack ?? error.message) : String(error);
    status.textContent = "ошибка";
    loading.dataset.hidden = "true";
    errorPanel.textContent = message;
    errorPanel.dataset.visible = "true";
    console.error("Termin Web Viewer failed", error);
}

try {
    if (!globalThis.isSecureContext) {
        throw new Error("WebGPU требует HTTPS или localhost (secure context).");
    }
    if (!navigator.gpu) {
        throw new Error("Этот браузер не предоставляет WebGPU adapter.");
    }
    const core = await createTerminCore();
    const input = createTerminWebInputAdapter(core, {canvas}).attach();
    const host = createTerminWebHost(core, {
        onStateChange({state, error}) {
            status.textContent = error ? `${state}: ${error}` : state;
        },
        onFrame({frameCount, metrics}) {
            if (frameCount % 30 === 0) {
                status.textContent = `running · ${canvas.width}×${canvas.height} · ${metrics.averageFrameMs.toFixed(1)} ms · input ${input.metrics.events}`;
            }
        },
    });
    globalThis.__terminViewer = {core, host, input};
    await host.load("./fixtures/render-package/");
    input.setEnabled(true);
    canvas.focus({preventScroll: true});
    loading.dataset.hidden = "true";
} catch (error) {
    fail(error);
}
</script>
</body>
</html>
