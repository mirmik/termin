  <script type="module">
    import createFixture from './tgfx2_webgpu_binding_layout_fixture.mjs';
    const result = document.querySelector('#result');
    try {
      const module = await createFixture();
      module._tgfx2_webgpu_binding_layout_start();

        const status = module._tgfx2_webgpu_binding_layout_status();
        if (status === 2) {
          requestAnimationFrame(() => { result.textContent = 'TERMIN_WEBGPU_BINDING_LAYOUT_READY'; });

          setTimeout(poll, 20);

    }
