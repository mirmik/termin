name: Docs

on:
  push:
    branches: [master]
    paths:
      - '**/docs/**'
      - '**/mkdocs.yml'
      - 'build-system/docs-publication.json'
      - 'build-system/districts.json'
      - 'build-system/python-docs-lock.txt'
      - 'build-system/modules.json'
      - 'build-system/packages.json'
      - 'build-system/repository-policies.json'
      - 'Taskfile.yml'
      - 'scripts/build/docs.sh'
      - 'scripts/build/setup-docs-env.sh'
      - 'core/termin-build-tools/termin_build/repository_control.py'
      - 'core/termin-build-tools/termin_build/repository_control_cli.py'
      - 'core/termin-build-tools/termin_build/source_size_policy.py'
      - 'core/termin-build-tools/termin_build/product_manifest.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3
        with:
          version: 3.52.0
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build manifest-driven documentation
        run: task docs:build --

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
