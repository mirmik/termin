name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk-profiles-linux:
    name: sdk-profile-${{ matrix.profile }}-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [core, graphics]
    steps:
      - name: Setup Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3
        with:
          version: 3.52.0
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Linux build dependencies
        uses: ./.github/actions/setup-linux-build
      - name: Setup Slang compiler
        if: matrix.profile == 'graphics'
        uses: ./.github/actions/setup-slang
      - name: Build SDK profile
        run: task build -- --profile "${{ matrix.profile }}"
      - name: Verify installed Core consumers
        if: matrix.profile == 'core'
        run: sdk-core/bin/termin_python -I scripts/smoke-installed-core-consumers --sdk-root sdk-core
      - name: Verify installed Graphics consumers
        if: matrix.profile == 'graphics'
        run: scripts/smoke-installed-graphics-consumers --sdk-root sdk-graphics --slangc "$TERMIN_SLANGC"

  # ── 0. Python lint ─────────────────────────────────────────────
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3
        with:
          version: 3.52.0
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: pip install ruff

      - name: Validate district ownership
        run: task ownership

      - name: Run Python lint
        run: task lint:python -- --no-venv

  # ── 0a. C/C++ lint ─────────────────────────────────────────────
  lint-cpp:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3
        with:
          version: 3.52.0
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Prepare canonical Python build environment
        env:
          PYTHONPATH: ${{ github.workspace }}/core/termin-build-tools
        run: |
          python -m termin_build.sdk --repo-root . prepare-python-toolchain
          echo "PYTHON_BIN=${{ github.workspace }}/build/python-runtime/build-env/bin/python" >> "$GITHUB_ENV"
          echo "PYTHON_EXECUTABLE=${{ github.workspace }}/build/python-runtime/build-env/bin/python" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        uses: ./.github/actions/setup-linux-build
        with:
          extra-packages: clang-tidy libclang-18-dev llvm-18-dev

      - name: Run C/C++ lint
        run: task lint:cpp --

      - name: Check C++ class member order
        run: |
          task check:cpp-layout -- --self-test
          task check:cpp-layout -- --format jsonl --no-fail > build/cpp-class-layout-normal.jsonl
          task lint:cpp -- --python-bindings --configure-only
          task check:cpp-layout -- --python-bindings --format jsonl --no-fail > build/cpp-class-layout-python.jsonl

      - name: Upload C++ class member-order inventories
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: cpp-class-layout-inventories
          path: build/cpp-class-layout-*.jsonl
          if-no-files-found: error
          retention-days: 14

  # ── 0c. Build system smoke ─────────────────────────────────────
  smoke-build-system-windows:
    runs-on: windows-latest
    steps:
      - name: Setup Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3
        with:
          version: 3.52.0
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install pytest setuptools wheel

      - name: Validate package manifest
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$pwd\core\termin-build-tools"
          python -m termin_build.package_manifest --repo-root . --check

      - name: Run build-tools tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$pwd\core\termin-build-tools"
          python -m pytest core/termin-build-tools/tests/ -v `
            --ignore=core/termin-build-tools/tests/test_graphics_showcase_contract.py

      - name: Smoke Task build frontend
        shell: pwsh
        run: task build -- --dry-run

  # ── 0e. Chromium Web Runtime gate ──────────────────────────────
  web-runtime-chromium:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3
        with:
          version: 3.52.0
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Cache pinned Emscripten toolchain
        uses: actions/cache@v5
        with:
          path: ~/.cache/termin/toolchains/emscripten
          key: emsdk-${{ runner.os }}-${{ hashFiles('build-system/emscripten-version.txt') }}

      - name: Setup Web toolchains
        run: |
          task toolchain:web --
          task toolchain:web-shaders --

      - name: Resolve Chromium executable
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$browser" ]]; then
            echo "ERROR: GitHub runner does not provide a Chromium-family browser" >&2
            exit 1
          fi
          echo "TERMIN_WEB_BROWSER=$browser" >> "$GITHUB_ENV"

      - name: Build Web Runtime
        run: task build:web

      - name: Run Web Runtime Node smoke
        run: task test:web

      - name: Run Chromium Web Runtime gate
        run: xvfb-run -a task test:web:browser

      - name: Upload Web Runtime gate report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: web-runtime-chromium-gate
          path: build/web-core/bin/browser-gate-report.json
          if-no-files-found: error
          retention-days: 14

  # ── 0d. D3D11 tgfx2 smoke ─────────────────────────────────────
  tgfx2-d3d11-bound-windows:
    runs-on: windows-latest
    steps:
      - name: Setup Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3
        with:
          version: 3.52.0
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup Slang compiler
        shell: pwsh
        run: |
          $slangc = python scripts/install_slang_toolchain.py --no-configure --print-path
          if ($LASTEXITCODE -ne 0) { throw "Slang setup failed" }
          "TERMIN_SLANGC=$slangc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build D3D11 SDK
        shell: pwsh
        run: task build -- --no-vulkan --no-opengl

      - name: Validate D3D11 bound resource path
        shell: pwsh
        run: |
          task test -- --process-smoke-only `
            --process-smoke-profile=windows-d3d11-bound

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: d3d11-execution-manifest
          path: |
            build/process-smoke/windows-d3d11-bound/execution-manifest.json
            build/process-smoke/windows-d3d11-bound/logs/
          retention-days: 7

  # ── 1. Build C++ libraries ───────────────────────────────────────
  build-cpp-libs:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3
        with:
          version: 3.52.0
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Prepare canonical Python build environment
        env:
          PYTHONPATH: ${{ github.workspace }}/core/termin-build-tools
        run: |
          python -m termin_build.sdk --repo-root . prepare-python-toolchain
          echo "PYTHON_BIN=${{ github.workspace }}/build/python-runtime/build-env/bin/python" >> "$GITHUB_ENV"
          echo "PYTHON_EXECUTABLE=${{ github.workspace }}/build/python-runtime/build-env/bin/python" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        uses: ./.github/actions/setup-linux-build

      - name: Setup Slang compiler
        uses: ./.github/actions/setup-slang

      - name: Build
        run: task build:cpp --

      - uses: actions/upload-artifact@v5
        with:
          name: sdk-cpp
          path: sdk/
          retention-days: 1

  # ── 2. Test C++ libraries ────────────────────────────────────────
  test-cpp-libs:
    needs: build-cpp-libs
    runs-on: ubuntu-latest
    steps:
      - name: Setup Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3
        with:
          version: 3.52.0
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        uses: ./.github/actions/setup-linux-build

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Prepare canonical Python build environment
        env:
          PYTHONPATH: ${{ github.workspace }}/core/termin-build-tools
        run: |
          python -m termin_build.sdk --repo-root . prepare-python-toolchain
          echo "PYTHON_BIN=${{ github.workspace }}/build/python-runtime/build-env/bin/python" >> "$GITHUB_ENV"
          echo "PYTHON_EXECUTABLE=${{ github.workspace }}/build/python-runtime/build-env/bin/python" >> "$GITHUB_ENV"

      - name: Setup Slang compiler
        uses: ./.github/actions/setup-slang

      - uses: actions/download-artifact@v5
        with:
          name: sdk-cpp
          path: sdk/

      - name: Restore SDK executable permissions
        run: chmod +x sdk/bin/*

      - name: Run C++ tests
        run: task test:cpp --

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ctest-execution-manifest
          path: |
            build/Release/ctest-selection.json
            build/Release/ctest-execution-manifest.json
            build/Release/ctest-results.xml
          retention-days: 7

  test-cpp-windows:
    runs-on: windows-latest
    steps:
      - name: Setup Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3
        with:
          version: 3.52.0
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Prepare canonical Python build environment
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$pwd\core\termin-build-tools"
          python -m termin_build.sdk --repo-root . prepare-python-toolchain
          $python = "$pwd\build\python-runtime\build-env\Scripts\python.exe"
          "PYTHON_BIN=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHON_EXECUTABLE=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Slang compiler
        shell: pwsh
        run: |
          $slangc = python scripts/install_slang_toolchain.py --no-configure --print-path
          if ($LASTEXITCODE -ne 0) { throw "Slang setup failed" }
          "TERMIN_SLANGC=$slangc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run repository-controlled C++ tests
        shell: pwsh
        run: task test:cpp -- --no-vulkan --no-opengl --no-sdl

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ctest-execution-manifest-windows
          path: |
            build/Release/ctest-selection.json
            build/Release/ctest-execution-manifest.json
            build/Release/ctest-results.xml
          retention-days: 7

  # ── 3. Build nanobind SDK + Python bindings ────────────────────
  build-bindings:
    needs: build-cpp-libs
    runs-on: ubuntu-latest
    steps:
      - name: Setup Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3
        with:
          version: 3.52.0
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Linux build dependencies
        uses: ./.github/actions/setup-linux-build

      - name: Setup Slang compiler
        uses: ./.github/actions/setup-slang

      - uses: actions/download-artifact@v5
        with:
          name: sdk-cpp
          path: sdk/

      - name: Restore SDK executable permissions
        run: chmod +x sdk/bin/*

      - name: Prepare canonical Python build environment
        env:
          PYTHONPATH: ${{ github.workspace }}/core/termin-build-tools
        run: |
          python -m termin_build.sdk --repo-root . prepare-python-toolchain
          echo "PYTHON_BIN=${{ github.workspace }}/build/python-runtime/build-env/bin/python" >> "$GITHUB_ENV"
          echo "PYTHON_EXECUTABLE=${{ github.workspace }}/build/python-runtime/build-env/bin/python" >> "$GITHUB_ENV"

      - name: Build bindings
        run: task build:bindings --

      - name: Populate and verify bundled Python runtime
        env:
          PYTHONPATH: ${{ github.workspace }}/core/termin-build-tools
        run: |
          "$PYTHON_BIN" -m termin_build.sdk --repo-root . install-python
          "$PYTHON_BIN" -m termin_build.sdk --repo-root . verify-sdk

      - uses: actions/upload-artifact@v5
        with:
          name: sdk-full
          path: sdk/
          retention-days: 1

  # ── 4. Test pip packages ───────────────────────────────────────
  test-pip-packages:
    needs: build-bindings
    runs-on: ubuntu-latest
    steps:
      - name: Setup Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3
        with:
          version: 3.52.0
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Linux build dependencies
        uses: ./.github/actions/setup-linux-build

      - name: Setup Slang compiler
        uses: ./.github/actions/setup-slang

      - uses: actions/download-artifact@v5
        with:
          name: sdk-full
          path: sdk/

      - name: Restore SDK executable permissions
        run: chmod +x sdk/bin/*

      - name: Resolve SDK Python layout
        uses: ./.github/actions/resolve-sdk-python

      - name: Prepare SDK package Python
        uses: ./.github/actions/prepare-sdk-package-python

      - name: Install pip packages
        env:
          TERMIN_BINDINGS_DIR: ${{ env.SDK_SITE_PACKAGES }}
        run: task install:packages --

      - name: Run Python tests
        env:
          TERMIN_SDK: ${{ github.workspace }}/sdk
          TERMIN_SHADERC: ${{ github.workspace }}/sdk/bin/termin_shaderc
          PYTHON_BIN: ${{ github.workspace }}/sdk/bin/termin_python
          LD_LIBRARY_PATH: ${{ github.workspace }}/sdk/lib
        run: |
          if [[ ! -x "$TERMIN_SHADERC" ]]; then
            echo "ERROR: SDK shader compiler is missing or not executable: $TERMIN_SHADERC" >&2
            exit 1
          fi
          task test:python:setup --
          TERMIN_TEST_EXECUTION_MANIFEST=${{ github.workspace }}/build/python-execution-manifest.json \
            task test:python --

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: python-execution-manifest
          path: build/python-execution-manifest.json
          retention-days: 7

  verify-pr-linux-coverage:
    needs: [test-cpp-libs, test-pip-packages]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.test-cpp-libs.result == 'success' && needs.test-pip-packages.result == 'success' }}
    steps:
      - name: Setup Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3
        with:
          version: 3.52.0
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v5
        with:
          name: ctest-execution-manifest
          path: build/ci-results/ctest/

      - uses: actions/download-artifact@v5
        with:
          name: python-execution-manifest
          path: build/ci-results/python/

      - name: Verify PR inventory coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/core/termin-build-tools
        run: |
          mkdir -p build/ci-results
          python -m termin_build.repository_control --repo-root . check
          python -m termin_build.repository_control --repo-root . \
            plan pr --platform linux --json > build/ci-results/expected-pr-linux.json
          python -m termin_build.repository_control verify-execution \
            --expected build/ci-results/expected-pr-linux.json \
            --manifest build/ci-results/ctest/ctest-execution-manifest.json \
            --manifest build/ci-results/python/python-execution-manifest.json

  # ── 5. Build & test termin ───────────────────────────────────────
  test-termin:
    needs: build-bindings
    runs-on: ubuntu-latest
    steps:
      - name: Setup Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3
        with:
          version: 3.52.0
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Linux build dependencies
        uses: ./.github/actions/setup-linux-build

      - uses: actions/download-artifact@v5
        with:
          name: sdk-full
          path: sdk/

      - name: Restore SDK executable permissions
        run: chmod +x sdk/bin/*

      - name: Resolve SDK Python layout
        uses: ./.github/actions/resolve-sdk-python

      - name: Prepare SDK package Python
        uses: ./.github/actions/prepare-sdk-package-python

      - name: Install pip packages
        env:
          TERMIN_BINDINGS_DIR: ${{ env.SDK_SITE_PACKAGES }}
        run: task install:packages -- --editable

      - name: Run tests
        env:
          TERMIN_SDK: ${{ github.workspace }}/sdk
          LD_LIBRARY_PATH: ${{ github.workspace }}/sdk/lib
        run: |
          sdk/bin/termin_python -m termin_build.repository_control \
            --repo-root . plan sdk-installed --platform linux --json \
            > build/expected-sdk-installed-linux.json
          sdk/bin/termin_python -m termin_build.repository_control \
            --repo-root . run sdk-installed --platform linux \
            --executor process-smoke \
            --report-output build/termin-app-installed-execution-manifest.json
          sdk/bin/termin_python -m termin_build.repository_control \
            verify-execution \
            --expected build/expected-sdk-installed-linux.json \
            --manifest build/termin-app-installed-execution-manifest.json

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: termin-app-installed-execution-manifest
          path: build/termin-app-installed-execution-manifest.json
          retention-days: 7

  # ── 6. Build termin-csharp ──────────────────────────────────────
  test-csharp:
    needs: test-termin
    runs-on: ubuntu-latest
    steps:
      - name: Setup Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3
        with:
          version: 3.52.0
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install Linux build dependencies
        uses: ./.github/actions/setup-linux-build
        with:
          extra-packages: swig

      - uses: actions/download-artifact@v5
        with:
          name: sdk-full
          path: sdk/

      - name: Restore SDK executable permissions
        run: chmod +x sdk/bin/*

      - name: Resolve SDK Python layout
        uses: ./.github/actions/resolve-sdk-python

      - name: Prepare SDK package Python
        uses: ./.github/actions/prepare-sdk-package-python

      - name: Install pip packages
        env:
          TERMIN_BINDINGS_DIR: ${{ env.SDK_SITE_PACKAGES }}
        run: task install:packages --

      - name: Build termin-csharp
        run: |
          cmake -S termin-csharp -B termin-csharp/build/Release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/sdk \
            -DTERMIN_CSHARP_BUILD_NATIVE=ON \
            -DTERMIN_CSHARP_BUILD_MANAGED=ON \
            -DTERMIN_CSHARP_BUILD_TESTS=ON
          cmake --build termin-csharp/build/Release --parallel $(nproc)
