version: '3'

tasks:
  package:graphics:python:
    desc: Build standalone Linux Graphics wheels for CPython 3.14 and 3.14t
    platforms: [linux]
    cmds:
      - ./scripts/build/graphics-python.sh {{.CLI_ARGS}}

  package:graphics:python:manylinux:
    desc: Build and audit CPython 3.14/3.14t manylinux Graphics wheels
    platforms: [linux]
    cmds:
      - ./scripts/build/graphics-python-manylinux.sh {{.CLI_ARGS}}

  publish:graphics:python:
    desc: Validate or explicitly upload the complete Graphics wheel candidate
    platforms: [linux]
    cmds:
      - ./scripts/publish/graphics-python.sh {{.CLI_ARGS}}

  package:graphics:nuget:
    desc: Build the Windows D3D11 Graphics SDK and deterministic NuGet candidate
    platforms: [windows]
    cmds:
      - task: build:graphics
        vars: {CLI_ARGS: '--no-sdl --no-vulkan --no-opengl'}
      - powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/build/graphics-nuget.ps1

  test:graphics:nuget:
    desc: Build and run the clean Windows PackageReference Graphics NuGet gate
    platforms: [windows]
    cmds:
      - task: package:graphics:nuget
      - powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/test/graphics-nuget.ps1
